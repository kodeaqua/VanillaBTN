plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kodeaqua.vanillabtn'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId "io.github.kodeaqua.vanillabtn"
        minSdk 26
        targetSdk 35
        versionCode 900
        versionName "0.9.0"

        externalNativeBuild {
            cmake {
                targets "hmbtn_native"
                arguments "-DHMBTN_BUILD_NATIVE_WINDOW=ON",
                          "-DBUILD_TESTING=OFF",
                          "-DHMBTN_BUILD_GPU_SPIKE=OFF",
                          "-DHMBTN_ENH_GAMEPLAY=ON",
                          "-DHMBTN_ENH_NPC_BONDS=ON",
                          "-DHMBTN_ENH_PAUSE_MENU=ON",
                          "-DHMBTN_ENH_WIDESCREEN=ON",
                          "-DHMBTN_ENH_SCALING=ON",
                          "-DHMBTN_ENH_INTERPOLATION=ON",
                          "-DHMBTN_ENH_FILTERING=ON",
                          "-DHMBTN_ENH_ANTIALIASING=ON",
                          "-DHMBTN_ENH_PGXP=ON",
                          "-DHMBTN_ENH_DITHERING=ON",
                          "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG",
                          "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG",
                          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -DNDEBUG",
                          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -DNDEBUG",
                          "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a"
                cFlags "-march=armv8-a -O2 -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Wno-fortify-source"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../../../../port/CMakeLists.txt")
            version "3.31.6"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
